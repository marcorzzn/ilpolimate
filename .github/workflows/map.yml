name: Hourly Map Update

on:
  schedule:
    - cron: '0 * * * *'    # Mappa e Ultima Ora aggiornate ogni ora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Installiamo le dipendenze da requirements.txt
      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: Run Map Tensions Updater (Hourly)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python update_map.py

      - name: Commit and Push Report
        run: |
          git config --global user.name 'Polymath Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add assets/data/
          git commit -m "Automated Map Update $(date)" || echo "Nessun cambiamento"
          git push