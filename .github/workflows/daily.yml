name: Daily Polymath Brief (Free Tier)

on:
  schedule:
    - cron: '0 7 * * *'    # Rassegna giornaliera alle 07:00
    - cron: '0 */6 * * *'  # Mappa aggiornata ogni 6 ore (00, 06, 12, 18)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Installiamo le dipendenze da requirements.txt
      - name: Install Libraries
        run: pip install -r requirements.txt

      - name: Run Generator Script (Daily Brief)
        if: github.event.schedule == '0 7 * * *' || github.event_name == 'workflow_dispatch'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python daily_brief.py

      - name: Run Map Tensions Updater (Every 6h)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python update_map.py

      - name: Commit and Push Report
        run: |
          git config --global user.name 'Polymath Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add _posts/
          git add assets/data/
          git commit -m "Automated Content Update: Brief & Map $(date)" || echo "Nessun cambiamento"
          git push
