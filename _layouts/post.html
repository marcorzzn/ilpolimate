---
layout: default
---

<div style="max-width: 800px; margin: 0 auto; padding-top: 40px;">

    <div style="text-align: center; margin-bottom: 50px; border-bottom: 1px solid #e0e0e0; padding-bottom: 30px;">
        <h1
            style="font-family: 'Playfair Display', serif; font-size: 3.5rem; line-height: 1.1; margin: 0; font-weight: 900; color: inherit;">
            {{ page.title }}
        </h1>
    </div>

    <article style="font-family: 'Inter', sans-serif; font-size: 1.2rem; line-height: 1.6; color: inherit;">

        <style>
            /* Titoli Sezioni: Playfair Display */
            .section-title {
                font-family: 'Playfair Display', serif;
                font-size: 2.2rem;
                margin-top: 60px;
                margin-bottom: 30px;
                font-weight: 900;
                color: inherit;
                border-bottom: 2px solid currentColor;
                padding-bottom: 10px;
                text-transform: uppercase;
                letter-spacing: 2px;
                text-align: center;
            }

            /* Editoriale a Colonne e Drop Cap */
            .editorial-text {
                column-count: 3;
                column-gap: 40px;
                column-rule: 1px solid #ddd;
                text-align: justify;
                font-family: 'Georgia', serif;
                font-size: 1.1rem;
                line-height: 1.7;
            }

            .editorial-text>p:first-of-type::first-letter {
                font-family: 'Playfair Display', serif;
                font-size: 5rem;
                float: left;
                line-height: 0.8;
                margin-right: 12px;
                margin-top: 5px;
                color: #000;
            }

            @media (max-width: 900px) {
                .editorial-text {
                    column-count: 2;
                }
            }

            @media (max-width: 600px) {
                .editorial-text {
                    column-count: 1;
                    text-align: left;
                }
            }

            /* Feed Grid System */
            .feed-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                gap: 30px;
                margin-top: 20px;
            }

            .feed-cluster {
                background: #fff;
                border: 1px solid #eaeaea;
                border-top: 4px solid #111;
                padding: 25px;
                border-radius: 4px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
                transition: transform 0.2s;
            }

            .feed-cluster:hover {
                transform: translateY(-5px);
            }

            .cluster-header {
                font-family: 'Playfair Display', serif;
                font-size: 1.4rem;
                font-weight: 900;
                border-bottom: 1px solid #eee;
                padding-bottom: 15px;
                margin-bottom: 20px;
                color: #111;
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            /* Sottotitoli News nel Feed */
            .news-item {
                margin-top: 25px;
                padding-bottom: 25px;
                border-bottom: 1px dashed #eee;
            }

            .news-item:last-child {
                border-bottom: none;
                padding-bottom: 0;
            }

            .news-item h3 {
                font-family: 'Inter', sans-serif;
                font-size: 1.15rem;
                font-weight: 700;
                margin-top: 0;
                margin-bottom: 10px;
                color: #222;
                line-height: 1.4;
            }

            .news-item p {
                margin-bottom: 15px;
                font-size: 0.95rem;
                text-align: left;
                color: #444;
            }

            /* Link Fonte: Rosso e discreto */
            .news-item p.source-link a,
            article a {
                color: #d00;
                text-decoration: none;
                font-weight: 600;
                font-size: 0.85em;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .news-item p.source-link a:hover,
            article a:hover {
                text-decoration: underline;
            }

            /* Liste generali dentro article */
            article ul {
                padding-left: 20px;
                margin-bottom: 20px;
            }

            article li {
                margin-bottom: 10px;
                font-size: 0.95rem;
            }

            /* Rimuove HR se presente */
            article hr {
                display: none;
            }

            /* Dark Mode Support */
            body.dark-mode .feed-cluster {
                background: #1a1a1a;
                border-color: #333;
                border-top-color: #555;
            }

            body.dark-mode .cluster-header {
                color: #f0f0f0;
                border-bottom-color: #333;
            }

            body.dark-mode .news-item {
                border-bottom-color: #333;
            }

            body.dark-mode .news-item h3 {
                color: #fff;
            }

            body.dark-mode .news-item p {
                color: #ccc;
            }

            body.dark-mode .editorial-text>p:first-of-type::first-letter {
                color: #fff;
            }

            body.dark-mode .editorial-text {
                column-rule-color: #444;
            }
        </style>

        {{ content }}

    </article>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const clusters = document.querySelectorAll('.feed-cluster');
            clusters.forEach(cluster => {
                // Find all child elements that make up the content (skip header)
                const header = cluster.querySelector('.cluster-header');
                const contentWrapper = document.createElement('div');
                contentWrapper.className = 'cluster-content-wrapper';
                contentWrapper.style.transition = 'max-height 0.3s ease';

                // Move nodes sequentially
                Array.from(cluster.childNodes).forEach(node => {
                    if (node !== header && node.nodeName !== '#text' || (node.nodeName === '#text' && node.nodeValue.trim() !== '')) {
                        contentWrapper.appendChild(node);
                    }
                });

                cluster.appendChild(contentWrapper);

                // If content is too tall, add Read More
                // Set a small timeout to let the browser compute height
                setTimeout(() => {
                    if (contentWrapper.scrollHeight > 350) {
                        contentWrapper.style.maxHeight = '350px';
                        contentWrapper.style.overflow = 'hidden';
                        contentWrapper.style.position = 'relative';

                        const fadeOverlay = document.createElement('div');
                        fadeOverlay.style.position = 'absolute';
                        fadeOverlay.style.bottom = '0';
                        fadeOverlay.style.left = '0';
                        fadeOverlay.style.right = '0';
                        fadeOverlay.style.height = '80px';
                        fadeOverlay.style.background = 'linear-gradient(to bottom, transparent, var(--bg-color, white))';
                        fadeOverlay.className = 'fade-overlay';
                        contentWrapper.appendChild(fadeOverlay);

                        const btn = document.createElement('button');
                        btn.innerHTML = 'Continua a leggere &darr;';
                        btn.style.display = 'block';
                        btn.style.width = '100%';
                        btn.style.padding = '10px';
                        btn.style.marginTop = '15px';
                        btn.style.background = 'transparent';
                        btn.style.border = '1px solid currentColor';
                        btn.style.color = 'currentColor';
                        btn.style.cursor = 'pointer';
                        btn.style.fontFamily = "'Inter', sans-serif";
                        btn.style.fontWeight = '600';
                        btn.style.textTransform = 'uppercase';
                        btn.style.letterSpacing = '1px';
                        btn.style.borderRadius = '4px';

                        btn.onclick = function () {
                            if (contentWrapper.style.maxHeight === '350px') {
                                contentWrapper.style.maxHeight = contentWrapper.scrollHeight + 'px';
                                fadeOverlay.style.display = 'none';
                                btn.innerHTML = 'Riduci &uarr;';
                            } else {
                                contentWrapper.style.maxHeight = '350px';
                                fadeOverlay.style.display = 'block';
                                btn.innerHTML = 'Continua a leggere &darr;';
                            }
                        };

                        cluster.appendChild(btn);
                    }
                }, 100);
            });

            // Applica il colore di background alla sfumatura in base al tema
            const isDark = document.body.classList.contains('dark-mode');
            document.documentElement.style.setProperty('--bg-color', isDark ? '#1a1a1a' : '#ffffff');
        });

        // Ascolta anche il cambio tema per aggiornare il colore di sfumatura
        const originalToggleDark = window.toggleDark;
        window.toggleDark = function () {
            if (originalToggleDark) originalToggleDark();
            const isDark = document.body.classList.contains('dark-mode');
            document.documentElement.style.setProperty('--bg-color', isDark ? '#1a1a1a' : '#ffffff');
        }
    </script>

    <div style="height: 100px;"></div>

</div>
