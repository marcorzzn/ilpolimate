<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa delle Tensioni | Il Polimate</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #map {
            width: 100vw;
            height: 100vh;
            filter: contrast(1.2) grayscale(0.2);
        }

        .ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-left: 3px solid #d00;
            max-width: 300px;
        }

        .context-panel {
            position: absolute;
            right: -400px;
            top: 0;
            width: 350px;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            border-left: 1px solid #333;
            z-index: 1001;
            padding: 30px;
            box-sizing: border-box;
            transition: right 0.3s ease;
            overflow-y: auto;
        }

        .context-panel.active {
            right: 0;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        p.sub {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        .pulse-icon {
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(255, 0, 0, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 0, 0, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0);
            }
        }

        .category-conflict {
            background: #ff3333;
        }

        .category-protest {
            background: #ff9900;
        }

        .category-infra {
            background: #9933ff;
        }

        .panel-meta {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }

        .panel-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .panel-desc {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ddd;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            cursor: pointer;
            font-size: 1.5rem;
        }

        .timeline-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #333;
        }

        .timeline-slider {
            flex-grow: 1;
            cursor: pointer;
        }

        .timeline-date {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            color: #fff;
            min-width: 100px;
            text-align: right;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <div class="ui-layer">
        <h1>MAPPA DELLE TENSIONI</h1>
        <p class="sub">Osservatorio Sistemico Globale</p>
        <div style="margin-top: 15px; font-size: 0.8rem;">
            <div style="margin-bottom: 5px;"><span style="color:#ff3333">●</span> Conflitti Armati</div>
            <div style="margin-bottom: 5px;"><span style="color:#ff9900">●</span> Instabilità Civile</div>
            <div><span style="color:#9933ff">●</span> Eventi Critici</div>
        </div>
    </div>

    <div id="map"></div>

    <div class="context-panel" id="contextPanel">
        <div class="close-btn" onclick="closePanel()">×</div>
        <div id="panelContent">
            <!-- Dynamic Content -->
        </div>
    </div>

    <div class="timeline-container" id="timelineContainer" style="display: none;">
        <input type="range" id="timeSlider" class="timeline-slider" min="0" max="0" value="0" step="1">
        <div class="timeline-date" id="timeDateDisplay">--/--/----</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Init Map (Dark Mode)
        const map = L.map('map', { zoomControl: false }).setView([30, 10], 3);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        function getColor(cat) {
            if (cat === 'CONFLICT') return '#ff3333';
            if (cat === 'PROTEST') return '#ff9900';
            if (cat === 'INFRASTRUCTURE_CRITICAL') return '#9933ff';
            return '#888888';
        }

        // Fetch Data
        let mapData = null;
        let mapDates = [];
        let geojsonLayer = null;

        fetch('{{ site.baseurl }}/assets/data/tensions.json')
            .then(res => {
                if (!res.ok) {
                    throw new Error("HTTP " + res.status);
                }
                return res.json();
            })
            .then(data => {
                const loadingMsg = document.getElementById('map-loading');
                if (loadingMsg) loadingMsg.remove();

                if (data.type === "FeatureCollection") {
                    const today = new Date().toISOString().split('T')[0];
                    mapData = {};
                    mapData[today] = data;
                } else {
                    mapData = data;
                }

                mapDates = Object.keys(mapData).sort();

                if (mapDates.length > 0) {
                    const slider = document.getElementById('timeSlider');
                    slider.max = mapDates.length - 1;
                    slider.value = mapDates.length - 1;
                    document.getElementById('timelineContainer').style.display = 'flex';

                    slider.addEventListener('input', (e) => {
                        renderDate(mapDates[e.target.value]);
                    });

                    renderDate(mapDates[mapDates.length - 1]);
                }
            })
            .catch(err => {
                console.log("Map Data Error:", err);
                const errorDiv = document.createElement('div');
                errorDiv.id = 'map-loading';
                errorDiv.style.position = 'absolute';
                errorDiv.style.top = '50%';
                errorDiv.style.left = '50%';
                errorDiv.style.transform = 'translate(-50%, -50%)';
                errorDiv.style.background = 'rgba(0,0,0,0.85)';
                errorDiv.style.color = '#fff';
                errorDiv.style.padding = '30px';
                errorDiv.style.borderRadius = '8px';
                errorDiv.style.textAlign = 'center';
                errorDiv.style.border = '1px solid #333';
                errorDiv.style.zIndex = '9999';
                errorDiv.innerHTML = `
                    <h2 style="font-family: 'Playfair Display', serif; margin-top:0;">Dati Non Ancora Disponibili</h2>
                    <p style="font-family: 'Inter', sans-serif; opacity: 0.8; max-width: 300px; margin:0 auto;">La mappa delle tensioni è in attesa della prima scansione dell'Agente. Torna più tardi.</p>
                `;
                document.body.appendChild(errorDiv);
            });

        function renderDate(dateStr) {
            document.getElementById('timeDateDisplay').innerText = dateStr;

            if (geojsonLayer) {
                map.removeLayer(geojsonLayer);
            }

            const featureCollection = mapData[dateStr];

            if (featureCollection && featureCollection.features) {
                geojsonLayer = L.geoJSON(featureCollection, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 6 + (feature.properties.intensity || 0),
                            fillColor: getColor(feature.properties.category),
                            color: "#000",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8,
                            className: 'pulse-icon'
                        });
                    },
                    onEachFeature: function (feature, layer) {
                        layer.on('click', function () {
                            showPanel(feature.properties);
                        });
                    }
                }).addTo(map);
            }
        }

        function showPanel(props) {
            const panel = document.getElementById('contextPanel');
            const content = document.getElementById('panelContent');

            content.innerHTML = `
                <span class="panel-meta">${props.category} | INTENSITY: ${props.intensity}/10</span>
                <h2 class="panel-title">${props.title}</h2>
                <div class="panel-desc">${props.description}</div>
            `;

            panel.classList.add('active');
        }

        function closePanel() {
            document.getElementById('contextPanel').classList.remove('active');
        }
    </script>
</body>

</html>
